<figure class="m-diagram">

<title id="dg1t">Ciclo de vida del documento</title>
<desc id="dg1d">Subir, analizar, reporte, certificado y verificación por QR, en ese orden.</desc>
<defs><marker id="f1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#123f9e"/></marker></defs>
<g stroke="#123f9e" stroke-width="1.5">
<rect x="8" y="40" width="130" height="100" rx="12" fill="#eef3ff"/>
<rect x="159" y="40" width="130" height="100" rx="12" fill="#eef3ff"/>
<rect x="310" y="40" width="130" height="100" rx="12" fill="#eef3ff"/>
<rect x="461" y="40" width="130" height="100" rx="12" fill="#eef3ff"/>
<rect x="612" y="40" width="140" height="100" rx="12" fill="#236bfd" stroke="#236bfd"/>
</g>
<g stroke="#123f9e" stroke-width="2" marker-end="url(#f1)">
<line x1="140" y1="90" x2="157" y2="90"/><line x1="291" y1="90" x2="308" y2="90"/><line x1="442" y1="90" x2="459" y2="90"/><line x1="593" y1="90" x2="610" y2="90"/>
</g>
<g text-anchor="middle" fill="#123f9e">
<text x="73" y="30" font-size="12" font-weight="bold">PASO 1</text><text x="224" y="30" font-size="12" font-weight="bold">PASO 2</text><text x="375" y="30" font-size="12" font-weight="bold">PASO 3</text><text x="526" y="30" font-size="12" font-weight="bold">PASO 4</text><text x="682" y="30" font-size="12" font-weight="bold">PASO 5</text>
<text x="73" y="82" font-size="15" font-weight="bold">Subir</text><text x="73" y="102" font-size="11">PDF o DOCX</text><text x="73" y="117" font-size="11">(hasta 25 MB)</text>
<text x="224" y="82" font-size="15" font-weight="bold">Analizar</text><text x="224" y="102" font-size="11">similitud</text><text x="224" y="117" font-size="11">e IA estimada</text>
<text x="375" y="82" font-size="15" font-weight="bold">Reporte</text><text x="375" y="102" font-size="11">fuentes, IA y</text><text x="375" y="117" font-size="11">valoración global</text>
<text x="526" y="82" font-size="15" font-weight="bold">Certificado</text><text x="526" y="102" font-size="11">solo si el riesgo</text><text x="526" y="117" font-size="11">es bajo o medio</text>
</g>
<g text-anchor="middle" fill="#fff">
<text x="682" y="82" font-size="15" font-weight="bold">Verificación</text><text x="682" y="102" font-size="11">por código QR</text><text x="682" y="117" font-size="11">sin iniciar sesión</text>
</g>
<text x="380" y="172" text-anchor="middle" font-size="11" fill="#123f9e">Si el riesgo es alto o crítico no hay certificado: corrige el trabajo y vuelve a subirlo.</text>
</svg>
<figcaption>Diagrama 1. Ciclo de vida de un documento.</figcaption>
