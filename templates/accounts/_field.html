{# Campo de formulario de autenticación. Parámetros: id, name, label, type, autocomplete, placeholder, icon (user|mail|lock), password, errors, hint, extra #}
<div>
    <label for="{{ id }}" class="mb-1.5 block text-[13px] font-semibold text-slate-800">{{ label }}</label>
    <div class="relative">
        <span class="pointer-events-none absolute inset-y-0 left-0 flex w-11 items-center justify-center text-slate-400">
            <svg class="h-[18px] w-[18px]" viewBox="0 0 24 24" fill="none" aria-hidden="true">
                {% if icon == "lock" %}
                    <rect x="5" y="11" width="14" height="9" rx="2" stroke="currentColor" stroke-width="1.8"/>
                    <path d="M8 11V7.5a4 4 0 0 1 8 0V11" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
                {% elif icon == "mail" %}
                    <rect x="3.5" y="5.5" width="17" height="13" rx="2.5" stroke="currentColor" stroke-width="1.8"/>
                    <path d="m4.5 7.5 7.5 6 7.5-6" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
                {% else %}
                    <circle cx="12" cy="8" r="4" stroke="currentColor" stroke-width="1.8"/>
                    <path d="M4 20c0-3.3 3.6-6 8-6s8 2.7 8 6" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
                {% endif %}
            </svg>
        </span>
        <input id="{{ id }}" name="{{ name }}" type="{{ type|default:'text' }}" autocomplete="{{ autocomplete }}"
               required placeholder="{{ placeholder }}" title="{{ placeholder }}"
               {% if hint %}aria-describedby="{{ id }}-hint"{% endif %}
               {% if errors %}aria-invalid="true"{% endif %}
               class="field h-12 truncate pl-11 {% if password %}pr-12{% else %}pr-3{% endif %} {% if errors %}!border-red-400 focus:!ring-red-200{% endif %}">
        {% if password %}
            <button type="button" data-toggle-password="{{ id }}" aria-label="Mostrar contraseña" aria-pressed="false"
                    class="absolute inset-y-0 right-0 flex w-12 items-center justify-center rounded-r-xl text-slate-500 transition hover:text-[#123f9e]">
                <svg data-eye="open" class="h-5 w-5" viewBox="0 0 24 24" fill="none" aria-hidden="true">
                    <path d="M2.5 12C4.6 7.8 7.9 5.5 12 5.5s7.4 2.3 9.5 6.5c-2.1 4.2-5.4 6.5-9.5 6.5S4.6 16.2 2.5 12Z" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/>
                    <circle cx="12" cy="12" r="2.5" stroke="currentColor" stroke-width="1.8"/>
                </svg>
                <svg data-eye="closed" class="hidden h-5 w-5" viewBox="0 0 24 24" fill="none" aria-hidden="true">
                    <path d="M3 3l18 18M10.6 10.6a2 2 0 0 0 2.8 2.8M9.9 5.1A9.6 9.6 0 0 1 12 4.8c4.7 0 8.2 2.9 10 7.2a12 12 0 0 1-3.6 4.7M6.2 6.2A12 12 0 0 0 2.5 12c1.8 4.3 5.3 7.2 9.5 7.2 1.6 0 3.1-.4 4.5-1.2" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
                </svg>
            </button>
        {% endif %}
    </div>
    {% if hint %}<p id="{{ id }}-hint" class="mt-1.5 text-[12px] text-slate-600">{{ hint }}</p>{% endif %}
    {% if errors %}
        <p class="mt-1.5 flex items-start gap-1.5 text-[12.5px] font-medium text-red-700" role="alert">
            <svg class="mt-0.5 h-4 w-4 shrink-0" viewBox="0 0 24 24" fill="none" aria-hidden="true"><circle cx="12" cy="12" r="9" stroke="currentColor" stroke-width="1.8"/><path d="M12 7.5v5.5M12 16.2v.1" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
            <span>{{ errors|join:" " }}</span>
        </p>
    {% endif %}
</div>
