{# Sistema de diseño compartido (base.html y auth_base.html). Tailwind CDN + Alpine, sin build. #}
{% load static %}
<link rel="icon" href="{% static 'img/logo-iesppabl.png' %}">
<link rel="apple-touch-icon" href="{% static 'img/logo-iesppabl.png' %}">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<script src="https://cdn.tailwindcss.com/3.4.17"></script>
<script>
    tailwind.config = {
        theme: {
            extend: {
                colors: {
                    brand: { 50: "#eef3ff", 100: "#dce8ff", 200: "#bcd2ff", 400: "#5c93ff", 500: "#236bfd", 600: "#1b57d4", 700: "#123f9e", 800: "#0f3486", 900: "#0b2a6b" },
                    gold: { 50: "#fff8e6", 100: "#ffefc2", 400: "#f8c93a", 500: "#f5b400", 700: "#8a6100" },
                    ink: { 900: "#0f172a", 700: "#334155", 500: "#64748b" }
                },
                fontFamily: { sans: ["Inter", "ui-sans-serif", "system-ui", "-apple-system", "Segoe UI", "Roboto", "Helvetica Neue", "Arial", "sans-serif"] },
                borderRadius: { xl2: "1.125rem", xl3: "1.5rem" },
                boxShadow: {
                    soft: "0 1px 2px rgba(15,45,110,.04), 0 8px 24px -12px rgba(18,63,158,.18)",
                    lift: "0 2px 4px rgba(15,45,110,.05), 0 18px 40px -16px rgba(18,63,158,.32)",
                    glow: "0 10px 24px -10px rgba(35,107,253,.65)"
                }
            }
        }
    };
</script>
<script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.14.8/dist/cdn.min.js"></script>

<style type="text/tailwindcss">
    @layer base {
        html { font-family: Inter, ui-sans-serif, system-ui, sans-serif; -webkit-text-size-adjust: 100%; }
        body { @apply text-slate-800 antialiased; font-feature-settings: "cv11", "ss01"; }
        [x-cloak] { display: none !important; }
        :focus-visible { outline: 2px solid #236bfd; outline-offset: 2px; border-radius: 6px; }
        ::selection { background: #dce8ff; color: #0b2a6b; }
    }
    @layer components {
        .card { @apply rounded-xl2 border border-slate-200/80 bg-white shadow-soft; }
        .card-hover { @apply transition duration-200 hover:-translate-y-0.5 hover:shadow-lift; }
        .card-head { @apply flex flex-wrap items-center justify-between gap-3 border-b border-slate-100 px-5 py-4 sm:px-6; }
        .eyebrow { @apply text-[11px] font-bold uppercase tracking-[0.14em] text-brand-500; }
        .h-title { @apply text-[20px] font-bold tracking-tight text-brand-900 sm:text-[22px]; }

        .btn { @apply inline-flex h-10 select-none items-center justify-center gap-2 whitespace-nowrap rounded-xl px-4 text-[13px] font-semibold transition duration-150 active:scale-[0.98] disabled:cursor-not-allowed disabled:opacity-60; }
        .btn-sm { @apply h-8 rounded-lg px-3 text-[12px]; }
        .btn-lg { @apply h-12 px-5 text-[15px]; }
        .btn-primary { @apply bg-gradient-to-r from-brand-700 to-brand-500 text-white shadow-glow hover:brightness-110; }
        .btn-secondary { @apply border border-slate-300 bg-white text-slate-700 hover:border-brand-500/50 hover:bg-brand-50 hover:text-brand-700; }
        .btn-danger { @apply bg-red-600 text-white shadow-sm hover:bg-red-700; }
        .btn-ghost { @apply text-slate-600 hover:bg-brand-50 hover:text-brand-700; }
        .icon-btn { @apply inline-flex h-9 w-9 items-center justify-center rounded-lg text-slate-500 transition hover:bg-brand-50 hover:text-brand-700; }

        .badge { @apply inline-flex items-center gap-1.5 rounded-full border px-2.5 py-1 text-[11.5px] font-semibold leading-none; }
        .badge-dot { @apply h-1.5 w-1.5 rounded-full; }
        .badge-success { @apply border-emerald-200 bg-emerald-50 text-emerald-800; }
        .badge-warning { @apply border-gold-500/40 bg-gold-50 text-gold-700; }
        .badge-danger { @apply border-red-200 bg-red-50 text-red-800; }
        .badge-info { @apply border-brand-500/25 bg-brand-50 text-brand-700; }
        .badge-neutral { @apply border-slate-200 bg-slate-50 text-slate-600; }

        .field { @apply h-11 w-full min-w-0 rounded-xl border border-slate-300 bg-white px-3.5 text-[14px] text-slate-900 outline-none transition placeholder:text-slate-400 hover:border-slate-400 focus:border-brand-500 focus:ring-4 focus:ring-brand-500/15; }
        .field-label { @apply mb-1.5 block text-[12.5px] font-semibold text-slate-700; }

        .row-card { @apply flex items-center gap-4 rounded-xl border border-slate-200/80 bg-white px-4 py-3 shadow-sm transition duration-150 hover:border-brand-500/30 hover:shadow-soft; }
        .menu-panel { @apply absolute right-0 z-30 mt-1.5 w-56 origin-top-right overflow-hidden rounded-xl border border-slate-200 bg-white py-1 shadow-lift; }
        .menu-item { @apply flex w-full items-center gap-2.5 px-3.5 py-2 text-left text-[13px] font-medium text-slate-700 transition hover:bg-brand-50 hover:text-brand-700; }
        .menu-item[disabled], .menu-item.is-disabled { @apply cursor-not-allowed text-slate-400 hover:bg-transparent hover:text-slate-400; }

        .skeleton { @apply relative overflow-hidden rounded-md bg-slate-200/70; }
        .skeleton::after { content: ""; @apply absolute inset-0; background: linear-gradient(90deg, transparent, rgba(255,255,255,.65), transparent); transform: translateX(-100%); animation: shimmer 1.4s infinite; }

        .gauge-arc { stroke-dasharray: 0 100; transition: stroke-dasharray 1.1s cubic-bezier(.22,1,.36,1); }
        .gauge-ready .gauge-arc { stroke-dasharray: var(--v) 100; }

        .tab-link { @apply relative px-1 py-3 text-[13.5px] font-semibold text-slate-500 transition hover:text-brand-700; }
        .tab-link[aria-selected="true"], .tab-link.is-active { @apply text-brand-700; }
        .tab-link[aria-selected="true"]::after, .tab-link.is-active::after { content: ""; @apply absolute inset-x-0 -bottom-px h-0.5 rounded-full bg-brand-500; }
    }
    @keyframes shimmer { to { transform: translateX(100%); } }
    @keyframes fade-up { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
    @keyframes toast-in { from { opacity: 0; transform: translateX(16px); } to { opacity: 1; transform: none; } }
    .anim-fade-up { animation: fade-up .4s ease-out both; }
    .anim-toast { animation: toast-in .25s ease-out both; }
    @media (prefers-reduced-motion: reduce) {
        *, *::before, *::after { animation-duration: .001ms !important; animation-iteration-count: 1 !important; transition-duration: .001ms !important; scroll-behavior: auto !important; }
        .gauge-arc { stroke-dasharray: var(--v) 100; }
    }
</style>
<noscript><style>.gauge-arc { stroke-dasharray: var(--v) 100 !important; }</style></noscript>

<script>
    // Medidores circulares: se animan al entrar en pantalla.
    document.addEventListener("DOMContentLoaded", function () {
        var gauges = document.querySelectorAll("[data-gauge]");
        if (!gauges.length) return;
        function arm(el) { el.classList.add("gauge-ready"); }
        if (!("IntersectionObserver" in window)) { gauges.forEach(arm); return; }
        var io = new IntersectionObserver(function (entries) {
            entries.forEach(function (e) { if (e.isIntersecting) { arm(e.target); io.unobserve(e.target); } });
        }, { threshold: 0.2 });
        gauges.forEach(function (g) { io.observe(g); });
    });
</script>
