{# Input con icono. Parámetros: id, name, label, type, placeholder, icon (svg inner), value, required, autocomplete #}
<div>
    <label for="{{ id }}" class="field-label">{{ label }}</label>
    <div class="relative">
        {% if icon %}
            <span class="pointer-events-none absolute inset-y-0 left-0 flex w-10 items-center justify-center text-slate-400">
                <svg class="h-[18px] w-[18px]" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">{{ icon|safe }}</svg>
            </span>
        {% endif %}
        <input id="{{ id }}" name="{{ name }}" type="{{ type|default:'text' }}" value="{{ value }}" placeholder="{{ placeholder }}"
               {% if autocomplete %}autocomplete="{{ autocomplete }}"{% endif %} {% if required %}required{% endif %}
               class="field {% if icon %}pl-10{% endif %}">
    </div>
</div>
