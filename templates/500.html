{% load static %}<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Error del servidor | IESPP Alfonso Barrantes Lingán</title>
    <link rel="icon" href="{% static 'img/logo-iesppabl.png' %}">
    <style>
        /* Autocontenida a propósito: no depende de CDN ni de la base de datos. */
        body {
            font-family: Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
            margin: 0; color: #334155; display: flex; min-height: 100vh; align-items: center; justify-content: center; padding: 16px;
            background: radial-gradient(700px 400px at 90% -10%, rgba(35,107,253,.12), transparent 60%), #f6f9ff;
        }
        .box { max-width: 440px; padding: 36px 32px; text-align: center; background: #fff; border: 1px solid #e2e8f0; border-radius: 20px; box-shadow: 0 18px 40px -16px rgba(18,63,158,.3); }
        .bar { height: 4px; border-radius: 4px; margin: -36px -32px 28px; background: linear-gradient(90deg,#f5b400,#236bfd 55%,#123f9e); border-radius: 20px 20px 0 0; }
        h1 { color: #0b2a6b; font-size: 22px; font-weight: 700; margin: 16px 0 8px; letter-spacing: -.01em; }
        p { font-size: 14px; line-height: 1.6; margin: 0 0 22px; }
        a { display: inline-block; padding: 11px 22px; border-radius: 12px; background: linear-gradient(90deg,#123f9e,#236bfd); color: #fff; font-weight: 600; font-size: 13px; text-decoration: none; }
        a:focus-visible { outline: 2px solid #236bfd; outline-offset: 2px; }
    </style>
</head>
<body>
    <div class="box">
        <div class="bar"></div>
        <img src="{% static 'img/logo-iesppabl.png' %}" alt="" style="height:56px;width:auto;">
        <h1>Algo salió mal</h1>
        <p>
            Ocurrió un error inesperado en el servidor. El equipo técnico ha
            sido notificado. Intenta de nuevo en unos minutos.
        </p>
        <a href="/">Volver al inicio</a>
    </div>
</body>
</html>
