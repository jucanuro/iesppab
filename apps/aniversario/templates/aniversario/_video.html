{% load aniversario_tags %}{% if obj.video_archivo %}<div class="vd vd-arch"><video controls preload="metadata" playsinline src="{{ obj.video_archivo.url }}" title="{{ titulo }}"></video></div>{% else %}{% with src=obj.video_url|embebido %}{% if src %}<div class="vd"><iframe src="{{ src }}" title="{{ titulo }}" loading="lazy" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe></div>{% else %}<div class="vd vd-vacio" role="img" aria-label="Video de presentación próximamente"><span class="tt">{{ etiqueta|default:"Video de presentación" }}</span><span class="vd-play" aria-hidden="true">▶</span><b>Muy pronto</b><small>{{ pie|default:"El video de presentación se publicará aquí." }}</small></div>{% endif %}{% endwith %}{% endif %}
