{# Menú de acciones (⋯). Abrir con este include, poner .menu-item dentro y cerrar con action_menu_end.html. Parámetro: label (aria) #}
<div class="relative" x-data="{ open: false, up: false }" @keydown.escape.window="open = false" @click.outside="open = false">
    <button type="button" class="icon-btn" aria-haspopup="menu" :aria-expanded="open" aria-label="{{ label|default:'Más acciones' }}" @click="open = !open; if (open) { up = false; $nextTick(() => { const box = $root.closest('.scroll-pane'), p = $refs.panel.getBoundingClientRect(), r = $root.getBoundingClientRect(), edge = box ? box.getBoundingClientRect() : { top: 0, bottom: window.innerHeight }; up = p.bottom > edge.bottom && (r.top - edge.top) > p.height; }); }">
        <svg class="h-5 w-5" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><circle cx="5" cy="12" r="1.6"/><circle cx="12" cy="12" r="1.6"/><circle cx="19" cy="12" r="1.6"/></svg>
    </button>
    <div x-ref="panel" :class="up && '!bottom-full !top-auto !mb-1.5 !mt-0 !origin-bottom-right'" x-show="open" x-cloak x-transition:enter="transition ease-out duration-150" x-transition:enter-start="opacity-0 scale-95 -translate-y-1" x-transition:enter-end="opacity-100 scale-100 translate-y-0" x-transition:leave="transition ease-in duration-100" x-transition:leave-start="opacity-100 scale-100" x-transition:leave-end="opacity-0 scale-95" role="menu" class="menu-panel">
