{% extends "base.html" %}

{% block title %}Página no encontrada | IESPP Alfonso Barrantes Lingán{% endblock %}

{% block content %}
<section class="relative mx-auto max-w-md py-14 text-center">
    <p class="pointer-events-none absolute inset-x-0 top-2 -z-10 select-none text-[120px] font-extrabold leading-none tracking-tighter text-brand-100/70" aria-hidden="true">404</p>
    <div class="mx-auto flex h-16 w-16 items-center justify-center rounded-2xl bg-gradient-to-br from-brand-50 to-brand-100 text-brand-700 shadow-soft">
        <svg class="h-8 w-8" viewBox="0 0 24 24" fill="none" aria-hidden="true">
            <circle cx="11" cy="11" r="7" stroke="currentColor" stroke-width="1.8"/>
            <path d="M20 20L16 16" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
        </svg>
    </div>

    <h1 class="mt-5 text-[22px] font-bold tracking-tight text-brand-900">
        Página no encontrada
    </h1>

    <p class="mt-2 text-[13.5px] leading-6 text-slate-600">
        La dirección que buscas no existe o el recurso fue movido.
    </p>

    <div class="mt-6 flex justify-center gap-2">
        <a href="{% url 'documents:upload' %}"
           class="btn btn-primary">
            Ir a mis documentos
        </a>
    </div>
</section>
{% endblock %}
