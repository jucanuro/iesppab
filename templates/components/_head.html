{# Sistema de diseño compartido (base.html y auth_base.html). Tailwind CDN + Alpine, sin build. #}
{% load static %}
<link rel="icon" href="{% static 'img/logo-iesppabl.png' %}">
<link rel="apple-touch-icon" href="{% static 'img/logo-iesppabl.png' %}">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<script src="https://cdn.tailwindcss.com/3.4.17"></script>
<script>
    tailwind.config = {
        theme: {
            extend: {
                colors: {
                    brand: { 50: "#eef3ff", 100: "#dce8ff", 200: "#bcd2ff", 400: "#5c93ff", 500: "#236bfd", 600: "#1b57d4", 700: "#123f9e", 800: "#0f3486", 900: "#0b2a6b" },
                    gold: { 50: "#fff8e6", 100: "#ffefc2", 400: "#f8c93a", 500: "#f5b400", 700: "#8a6100" },
                    ink: { 900: "#0f172a", 700: "#334155", 500: "#64748b" }
                },
                fontFamily: { sans: ["Inter", "ui-sans-serif", "system-ui", "-apple-system", "Segoe UI", "Roboto", "Helvetica Neue", "Arial", "sans-serif"] },
                borderRadius: { xl2: "1.125rem", xl3: "1.5rem" },
                boxShadow: {
                    soft: "0 1px 2px rgba(15,45,110,.04), 0 8px 24px -12px rgba(18,63,158,.18)",
                    lift: "0 2px 4px rgba(15,45,110,.05), 0 18px 40px -16px rgba(18,63,158,.32)",
                    glow: "0 10px 24px -10px rgba(35,107,253,.65)"
                }
            }
        }
    };
</script>
<script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.14.8/dist/cdn.min.js"></script>

<style type="text/tailwindcss">
    @layer base {
        html { font-family: Inter, ui-sans-serif, system-ui, sans-serif; -webkit-text-size-adjust: 100%; }
        body { @apply text-slate-800 antialiased; font-feature-settings: "cv11", "ss01"; }
        [x-cloak] { display: none !important; }
        :focus-visible { outline: 2px solid #236bfd; outline-offset: 2px; border-radius: 6px; }
        ::selection { background: #dce8ff; color: #0b2a6b; }
    }
    @layer components {
        .card, .glass { @apply relative rounded-xl2 border border-white/70 bg-white/75 shadow-soft ring-1 ring-slate-900/[0.05] backdrop-blur-md transition-[box-shadow,border-color] duration-200; }
        .card:hover, .glass:hover { box-shadow: 0 1px 2px rgba(15,45,110,.05), 0 14px 36px -18px rgba(35,107,253,.38), inset 0 1px 0 rgba(255,255,255,.9); border-color: rgba(34,211,238,.35); }
        .card-hover { @apply transition duration-200 hover:-translate-y-0.5 hover:shadow-lift; }
        .card-head { @apply flex flex-wrap items-center justify-between gap-3 border-b border-slate-100 px-5 py-4 sm:px-6; }
        .eyebrow { @apply text-[11px] font-bold uppercase tracking-[0.14em] text-brand-500; }
        .h-title { @apply text-[20px] font-bold tracking-tight text-brand-900 sm:text-[22px]; }

        .btn { @apply inline-flex h-10 select-none items-center justify-center gap-2 whitespace-nowrap rounded-xl px-4 text-[13px] font-semibold transition duration-150 active:scale-[0.98] disabled:cursor-not-allowed disabled:opacity-60; }
        .btn-sm { @apply h-8 rounded-lg px-3 text-[12px]; }
        .btn-lg { @apply h-12 px-5 text-[15px]; }
        .btn-primary { @apply bg-gradient-to-r from-brand-600 to-brand-500 text-white shadow-glow hover:brightness-110; background-image: linear-gradient(90deg,#1b57d4,#236bfd 55%,#22d3ee); }
        .btn-secondary { @apply border border-slate-300 bg-white text-slate-700 hover:border-brand-500/50 hover:bg-brand-50 hover:text-brand-700; }
        .btn-danger { @apply bg-red-600 text-white shadow-sm hover:bg-red-700; }
        .btn-ghost { @apply text-slate-600 hover:bg-brand-50 hover:text-brand-700; }
        .icon-btn { @apply inline-flex h-9 w-9 items-center justify-center rounded-lg text-slate-500 transition hover:bg-brand-50 hover:text-brand-700; }

        .badge { @apply inline-flex items-center gap-1.5 rounded-full border px-2.5 py-1 text-[11.5px] font-semibold leading-none; }
        .badge-dot { @apply h-1.5 w-1.5 rounded-full; }
        .badge-success { @apply border-emerald-200 bg-emerald-50 text-emerald-800; }
        .badge-warning { @apply border-gold-500/40 bg-gold-50 text-gold-700; }
        .badge-danger { @apply border-red-200 bg-red-50 text-red-800; }
        .badge-info { @apply border-brand-500/25 bg-brand-50 text-brand-700; }
        .badge-neutral { @apply border-slate-200 bg-slate-50 text-slate-600; }

        .field { @apply h-11 w-full min-w-0 rounded-xl border border-slate-300 bg-white px-3.5 text-[14px] text-slate-900 outline-none transition placeholder:text-slate-400 hover:border-slate-400 focus:border-brand-500 focus:ring-4 focus:ring-brand-500/15; }
        .field-label { @apply mb-1.5 block text-[12.5px] font-semibold text-slate-700; }

        .row-card { @apply flex items-center gap-4 rounded-xl border border-white/70 bg-white/90 px-4 py-3 shadow-sm ring-1 ring-slate-900/[0.04] transition duration-200 hover:-translate-y-px hover:border-cyan-400/40 hover:shadow-soft; }
        .menu-panel { @apply absolute right-0 z-30 mt-1.5 w-60 origin-top-right overflow-hidden rounded-xl border border-white/70 bg-white/95 py-1 shadow-lift ring-1 ring-slate-900/5 backdrop-blur-xl; }
        .menu-item { @apply flex w-full items-center gap-2.5 px-3.5 py-2 text-left text-[13px] font-medium text-slate-700 transition hover:bg-brand-50 hover:text-brand-700; }
        .menu-item[disabled], .menu-item.is-disabled { @apply cursor-not-allowed text-slate-400 hover:bg-transparent hover:text-slate-400; }

        .skeleton { @apply relative overflow-hidden rounded-md bg-slate-200/70; }
        .skeleton::after { content: ""; @apply absolute inset-0; background: linear-gradient(90deg, transparent, rgba(255,255,255,.65), transparent); transform: translateX(-100%); animation: shimmer 1.4s infinite; }

        .gauge-arc { stroke-dasharray: 0 100; transition: stroke-dasharray 1.1s cubic-bezier(.22,1,.36,1); }
        .gauge-glow-brand { filter: drop-shadow(0 0 5px rgba(34,211,238,.55)); } .gauge-glow-success { filter: drop-shadow(0 0 5px rgba(16,185,129,.5)); } .gauge-glow-warning { filter: drop-shadow(0 0 5px rgba(245,180,0,.5)); } .gauge-glow-danger { filter: drop-shadow(0 0 5px rgba(220,38,38,.45)); }
        .gauge-ready .gauge-arc { stroke-dasharray: var(--v) 100; }

        .num { font-variant-numeric: tabular-nums; font-feature-settings: "tnum"; }
        .glow-line { position: relative; }
        .glow-line::after { content: ""; position: absolute; left: 0; right: 0; bottom: -1px; height: 1px; background: linear-gradient(90deg, transparent, #236bfd 25%, #22d3ee 50%, #236bfd 75%, transparent); background-size: 200% 100%; animation: sweep 6s linear infinite; opacity: .85; }
        .text-grad { background: linear-gradient(90deg,#236bfd,#22d3ee); -webkit-background-clip: text; background-clip: text; color: transparent; }
        .tab-link { @apply relative px-1 py-3 text-[13.5px] font-semibold text-slate-500 transition hover:text-brand-700; }
        .tab-link[aria-selected="true"], .tab-link.is-active { @apply text-brand-700; }
        .tab-link[aria-selected="true"]::after, .tab-link.is-active::after { content: ""; @apply absolute inset-x-0 -bottom-px h-0.5 rounded-full; background: linear-gradient(90deg,#236bfd,#22d3ee); }
    }

    /* Acordeón con transición suave (grid 0fr→1fr). El contenido plegado se marca `inert` desde Alpine. */
    .fold { display: grid; grid-template-rows: 0fr; opacity: 0; transition: grid-template-rows .35s cubic-bezier(.22,1,.36,1), opacity .25s ease; }
    .fold.is-open { grid-template-rows: 1fr; opacity: 1; }
    .fold > .fold-in { min-height: 0; overflow: hidden; }
    /* Paneles con scroll interno y barra fina. --pane-h: alto máximo según las barras fijas de la página. */
    :root { --pane-h: max(26rem, calc(100vh - 24rem)); --tray-h: max(20rem, calc(100vh - 31rem)); }
    .scroll-pane { max-height: var(--pane-h); overflow-y: auto; scrollbar-width: thin; scrollbar-color: #8fb0f7 transparent; }
    .tray-scroll { max-height: var(--tray-h); }
    .tray-head.is-stuck { box-shadow: 0 8px 16px -10px rgba(15,45,110,.4); }
    .scroll-pane-x { scrollbar-width: thin; scrollbar-color: #8fb0f7 transparent; }
    .scroll-pane::-webkit-scrollbar, .scroll-pane-x::-webkit-scrollbar { width: 8px; height: 8px; }
    .scroll-pane::-webkit-scrollbar-track, .scroll-pane-x::-webkit-scrollbar-track { background: transparent; }
    .scroll-pane::-webkit-scrollbar-thumb, .scroll-pane-x::-webkit-scrollbar-thumb { background: #b8cdfa; border-radius: 9999px; border: 2px solid transparent; background-clip: content-box; }
    .scroll-pane::-webkit-scrollbar-thumb:hover, .scroll-pane-x::-webkit-scrollbar-thumb:hover { background: #236bfd; background-clip: content-box; }
    @keyframes sweep { to { background-position: -200% 0; } }
    @keyframes ping-soft { 75%, 100% { transform: scale(2.4); opacity: 0; } }
    .bg-mesh { background-color: #eef2fb; background-image: radial-gradient(900px 480px at 88% -8%, rgba(35,107,253,.16), transparent 60%), radial-gradient(700px 420px at 4% 12%, rgba(34,211,238,.12), transparent 60%), radial-gradient(800px 500px at 50% 112%, rgba(18,63,158,.12), transparent 60%); background-attachment: fixed; }
    .bg-grid { background-image: linear-gradient(rgba(18,63,158,.045) 1px, transparent 1px), linear-gradient(90deg, rgba(18,63,158,.045) 1px, transparent 1px); background-size: 44px 44px; -webkit-mask-image: linear-gradient(to bottom, black, transparent 85%); mask-image: linear-gradient(to bottom, black, transparent 85%); }
    .dot-live { position: relative; } .dot-live::after { content: ""; position: absolute; inset: 0; border-radius: 9999px; background: inherit; animation: ping-soft 1.6s cubic-bezier(0,0,.2,1) infinite; }
    @keyframes shimmer { to { transform: translateX(100%); } }
    @keyframes fade-up { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
    @keyframes toast-in { from { opacity: 0; transform: translateX(16px); } to { opacity: 1; transform: none; } }
    .anim-fade-up { animation: fade-up .4s ease-out both; }
    .anim-toast { animation: toast-in .25s ease-out both; }
    @media (prefers-reduced-motion: reduce) {
        *, *::before, *::after { animation-duration: .001ms !important; animation-iteration-count: 1 !important; transition-duration: .001ms !important; scroll-behavior: auto !important; }
        .gauge-arc { stroke-dasharray: var(--v) 100; }
        .glow-line::after, .dot-live::after { animation: none; }
    }
</style>
<noscript><style>.gauge-arc { stroke-dasharray: var(--v) 100 !important; }</style></noscript>

<script>
    // Medidores circulares: se animan al entrar en pantalla.
    document.addEventListener("DOMContentLoaded", function () {
        var gauges = document.querySelectorAll("[data-gauge]");
        if (!gauges.length) return;
        function arm(el) { el.classList.add("gauge-ready"); }
        if (!("IntersectionObserver" in window)) { gauges.forEach(arm); return; }
        var io = new IntersectionObserver(function (entries) {
            entries.forEach(function (e) { if (e.isIntersecting) { arm(e.target); io.unobserve(e.target); } });
        }, { threshold: 0.2 });
        gauges.forEach(function (g) { io.observe(g); });
    });
</script>
<script>
    // Contadores: animan de 0 al valor al cargar (respeta prefers-reduced-motion).
    document.addEventListener("DOMContentLoaded", function () {
        var els = document.querySelectorAll("[data-count]");
        if (!els.length || window.matchMedia("(prefers-reduced-motion: reduce)").matches) return;
        els.forEach(function (el) {
            var raw = el.getAttribute("data-count"), end = parseFloat(raw), dec = (raw.split(".")[1] || "").length, t0 = null;
            if (isNaN(end)) return;
            function step(t) {
                if (t0 === null) t0 = t;
                var p = Math.min((t - t0) / 900, 1), e = 1 - Math.pow(1 - p, 3);
                el.textContent = (end * e).toFixed(dec) + (el.getAttribute("data-suffix") || "");
                if (p < 1) requestAnimationFrame(step);
            }
            requestAnimationFrame(step);
        });
    });
</script>
