<figure class="m-diagram">

<title id="dg2t">Cómo leer el reporte</title>
<desc id="dg2d">La similitud determina el nivel de riesgo, que decide el certificado. La similitud y la IA estimada determinan la valoración global, que es solo informativa.</desc>
<defs><marker id="f2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#123f9e"/></marker></defs>
<g stroke="#123f9e" stroke-width="1.5">
<rect x="8" y="15" width="230" height="95" rx="12" fill="#eef3ff"/>
<rect x="8" y="195" width="230" height="95" rx="12" fill="#eef3ff"/>
<rect x="285" y="15" width="200" height="95" rx="12" fill="#eef3ff"/>
<rect x="285" y="195" width="200" height="95" rx="12" fill="#236bfd" stroke="#236bfd"/>
<rect x="532" y="15" width="220" height="95" rx="12" fill="#fff"/>
<rect x="532" y="195" width="220" height="95" rx="12" fill="#fff"/>
</g>
<g stroke="#123f9e" stroke-width="2" marker-end="url(#f2)">
<line x1="240" y1="62" x2="283" y2="62"/><line x1="240" y1="85" x2="283" y2="215"/><line x1="240" y1="243" x2="283" y2="243"/><line x1="487" y1="62" x2="530" y2="62"/><line x1="487" y1="243" x2="530" y2="243"/>
</g>
<g fill="#123f9e" text-anchor="middle">
<text x="123" y="40" font-size="14" font-weight="bold">Similitud</text>
<text x="123" y="62" font-size="10.5">Bajo: menos de 25 %</text><text x="123" y="78" font-size="10.5">Medio: 25 % a menos de 50 %</text><text x="123" y="94" font-size="10.5">Alto: 50 % o más</text>
<text x="123" y="220" font-size="14" font-weight="bold">IA estimada</text>
<text x="123" y="242" font-size="10.5">Bajo: menos de 40 %</text><text x="123" y="258" font-size="10.5">Medio: 40 % a menos de 70 %</text><text x="123" y="274" font-size="10.5">Alto: 70 % o más</text>
<text x="385" y="40" font-size="14" font-weight="bold">Nivel de riesgo</text>
<text x="385" y="62" font-size="10.5">solo con la similitud:</text><text x="385" y="78" font-size="10.5">Bajo &lt;15 · Medio 15-29</text><text x="385" y="94" font-size="10.5">Alto 30-49 · Crítico ≥50</text>
<text x="642" y="40" font-size="14" font-weight="bold">Certificado</text>
<text x="642" y="62" font-size="10.5">Bajo o Medio: se puede emitir</text><text x="642" y="78" font-size="10.5">Alto o Crítico: no se emite</text><text x="642" y="94" font-size="10.5">La IA no lo bloquea</text>
<text x="642" y="220" font-size="14" font-weight="bold">Solo informativa</text>
<text x="642" y="242" font-size="10.5">No bloquea el certificado.</text><text x="642" y="258" font-size="10.5">Orienta la revisión</text><text x="642" y="274" font-size="10.5">del docente.</text>
</g>
<g fill="#fff" text-anchor="middle">
<text x="385" y="220" font-size="14" font-weight="bold">Valoración global</text>
<text x="385" y="244" font-size="11">la peor entre similitud</text><text x="385" y="260" font-size="11">e IA estimada</text><text x="385" y="276" font-size="11">(Bajo, Medio o Alto)</text>
</g>
</svg>
<figcaption>Diagrama 2. Cómo se relacionan similitud, IA, valoración global, nivel de riesgo y certificado.</figcaption>
