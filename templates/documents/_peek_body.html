{% comment %}Cuerpo de la vista rápida de una fila. Espera `document`. Se renderiza dentro de un <template> y el panel lo inyecta. Mismos permisos/estados que _row_menu.html.{% endcomment %}
{% with report=document.report %}
<div class="flex items-start gap-3">
    <span class="flex h-10 w-10 shrink-0 items-center justify-center rounded-xl bg-brand-50 text-brand-700"><svg class="h-5 w-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 3h7l5 5v13H7a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2Z"/><path d="M14 3v5h5M8.5 13h7M8.5 16.5H13"/></svg></span>
    <div class="min-w-0">
        <h3 class="break-words text-[15px] font-bold leading-snug text-brand-900">{{ document.title }}</h3>
        <p class="mt-0.5 truncate text-[11.5px] text-slate-500" title="{{ document.original_filename }}">{{ document.original_filename }}</p>
    </div>
</div>

<div class="mt-4 flex items-center gap-2.5 rounded-xl border border-slate-100 bg-slate-50/70 p-2.5">
    {% include "components/avatar.html" with name=document.owner.get_full_name|default:document.owner.username %}
    <div class="min-w-0">
        <p class="truncate text-[12.5px] font-semibold text-slate-800">{{ document.owner.get_full_name|default:document.owner.username }}</p>
        <p class="truncate text-[11.5px] text-slate-500">{{ document.owner.email }}</p>
    </div>
</div>
<div class="mt-2.5 flex flex-wrap items-center gap-1.5">
    {% include "documents/_status_badge.html" %}
    <span class="badge badge-neutral">{{ document.get_kind_display }}</span>
    <span class="text-[11.5px] text-slate-500">{{ document.created_at|date:"d/m/Y H:i" }}</span>
</div>

{% if report and document.status == "COMPLETED" %}
    {% with oa=report.overall_assessment %}
    <div class="mt-4 rounded-xl border p-3 {% if oa.key == 'high' %}border-red-200 bg-red-50{% elif oa.key == 'medium' %}border-gold-500/40 bg-gold-50{% else %}border-emerald-200 bg-emerald-50{% endif %}">
        <p class="text-[10.5px] font-bold uppercase tracking-[0.12em] {% if oa.key == 'high' %}text-red-700{% elif oa.key == 'medium' %}text-gold-700{% else %}text-emerald-700{% endif %}">Valoración global</p>
        <p class="mt-0.5 text-[26px] font-extrabold leading-none {% if oa.key == 'high' %}text-red-800{% elif oa.key == 'medium' %}text-gold-700{% else %}text-emerald-800{% endif %}">{{ oa.label }}</p>
    </div>
    {% endwith %}

    <div class="mt-3 grid grid-cols-2 gap-3">
        <div class="flex flex-col items-center rounded-xl border border-slate-100 p-3 text-center">
            <div class="relative h-[76px] w-[76px]" role="img" aria-label="Similitud: {{ report.similarity_percent }}%">
                <svg viewBox="0 0 80 80" class="h-full w-full -rotate-90" aria-hidden="true"><circle cx="40" cy="40" r="34" fill="none" stroke="#e2e9f8" stroke-width="8"/><circle class="peek-ring" cx="40" cy="40" r="34" fill="none" stroke-width="8" stroke-linecap="round" pathLength="100" stroke="{{ report.similarity_band.fg }}" style="--v:{{ report.similarity_percent|stringformat:'.2f' }}"/></svg>
                <span class="num absolute inset-0 flex items-center justify-center text-[15px] font-semibold tabular-nums text-slate-900">{{ report.similarity_percent|stringformat:".0f" }}%</span>
            </div>
            <p class="mt-1.5 text-[10.5px] font-bold uppercase tracking-[0.1em] text-slate-600">Similitud</p>
            <span class="mt-1 inline-flex rounded-full border px-2 py-0.5 text-[10.5px] font-semibold leading-tight" style="background-color:{{ report.similarity_band.bg }};border-color:{{ report.similarity_band.border }};color:{{ report.similarity_band.fg }};">{{ report.similarity_band.label }}</span>
        </div>
        <div class="flex flex-col items-center rounded-xl border border-slate-100 p-3 text-center">
            {% if report.ai_not_evaluable %}
            <div class="flex h-[76px] w-[76px] items-center justify-center rounded-full border-[8px] border-slate-200 px-1 text-center text-[10.5px] font-bold leading-tight text-slate-500" role="img" aria-label="IA: no evaluable" title="{{ report.ai_not_evaluable.note }}">No evaluable</div>
            <p class="mt-1.5 text-[10.5px] font-bold uppercase tracking-[0.1em] text-slate-600">IA estimada</p>
            <span class="mt-1 inline-flex rounded-full border px-2 py-0.5 text-[10.5px] font-semibold leading-tight" style="background-color:{{ report.ai_estimated_band.bg }};border-color:{{ report.ai_estimated_band.border }};color:{{ report.ai_estimated_band.fg }};">{{ report.ai_estimated_band.label }}</span>
            {% else %}
            <div class="relative h-[76px] w-[76px]" role="img" aria-label="IA estimada: {{ report.ai_estimated_percent|floatformat:1 }}%">
                <svg viewBox="0 0 80 80" class="h-full w-full -rotate-90" aria-hidden="true"><circle cx="40" cy="40" r="34" fill="none" stroke="#e2e9f8" stroke-width="8"/><circle class="peek-ring" cx="40" cy="40" r="34" fill="none" stroke-width="8" stroke-linecap="round" pathLength="100" stroke="{{ report.ai_estimated_band.fg }}" style="--v:{{ report.ai_estimated_percent|stringformat:'.2f' }}"/></svg>
                <span class="num absolute inset-0 flex items-center justify-center text-[15px] font-semibold tabular-nums text-slate-900">{{ report.ai_estimated_percent|stringformat:".0f" }}%</span>
            </div>
            <p class="mt-1.5 text-[10.5px] font-bold uppercase tracking-[0.1em] text-slate-600">IA estimada</p>
            <span class="mt-1 inline-flex rounded-full border px-2 py-0.5 text-[10.5px] font-semibold leading-tight" style="background-color:{{ report.ai_estimated_band.bg }};border-color:{{ report.ai_estimated_band.border }};color:{{ report.ai_estimated_band.fg }};">{{ report.ai_estimated_band.label }}</span>
            {% endif %}
        </div>
    </div>
{% else %}
    <p class="mt-4 rounded-xl border border-dashed border-slate-200 bg-slate-50/60 px-3 py-4 text-center text-[12.5px] text-slate-500">
        {% if document.status == "QUEUED" or document.status == "PROCESSING" %}Análisis en curso; los resultados aparecerán al terminar.{% elif document.status == "FAILED" %}El análisis falló. Puedes reanalizarlo desde el menú ⋯.{% else %}Aún sin análisis. Pulsa «Analizar originalidad» en el menú ⋯ de la fila.{% endif %}
    </p>
{% endif %}

<div class="mt-4 grid gap-2">
    {% if document.status == "UPLOADED" %}
        <span class="btn btn-primary cursor-not-allowed opacity-50" aria-disabled="true" title="El reporte estará disponible tras analizar el documento">Ver reporte</span>
    {% else %}
        <a href="{% url 'reports:detail' document.id %}" class="btn btn-primary">Ver reporte</a>
    {% endif %}
    <div class="grid grid-cols-2 gap-2">
        {% if report and document.status == "COMPLETED" %}
            <a href="{% url 'reports:download_highlighted' document.id %}" class="btn btn-sm btn-tint btn-cyan">Informe de similitud</a>
            <a href="{% url 'reports:download_ai_report' document.id %}" class="btn btn-sm btn-tint btn-violet">Informe de IA</a>
        {% else %}
            <span class="btn btn-secondary btn-sm cursor-not-allowed opacity-50" aria-disabled="true" title="El informe estará disponible tras analizar el documento.">Informe de similitud</span>
            <span class="btn btn-secondary btn-sm cursor-not-allowed opacity-50" aria-disabled="true" title="El informe estará disponible tras analizar el documento.">Informe de IA</span>
        {% endif %}
    </div>
    {% if report.certificate.is_active %}
        <a href="{% url 'certificates:download' report.certificate.id %}" class="btn btn-sm btn-emerald">Descargar certificado</a>
    {% elif document.status == "COMPLETED" and report and report.risk_level != "HIGH" and report.risk_level != "CRITICAL" %}
        <form method="post" action="{% url 'certificates:generate' document.id %}" data-submit-spinner>
            {% csrf_token %}
            <button type="submit" class="btn btn-sm btn-emerald w-full" data-loading-label="Generando…">Generar certificado</button>
        </form>
    {% else %}
        <span class="btn btn-secondary btn-sm cursor-not-allowed opacity-50" aria-disabled="true"
              title="{% if document.status == 'COMPLETED' and report.risk_level == 'HIGH' or document.status == 'COMPLETED' and report.risk_level == 'CRITICAL' %}No se puede emitir un certificado con riesgo alto o crítico. Revísalo y vuelve a analizarlo.{% else %}El certificado estará disponible cuando termine el análisis.{% endif %}">Certificado no disponible</span>
    {% endif %}
</div>
{% endwith %}
