{# KPI. Parámetros: label, value, hint, tone (brand|gold|emerald), icon (svg inner), spark (puntos "x,y x,y..." opcional, datos reales) #}
<article class="card card-hover relative overflow-hidden p-4 sm:p-5">
    <div class="flex items-start justify-between gap-3">
        <div class="min-w-0">
            <p class="text-[11px] font-bold uppercase tracking-[0.12em] text-slate-500">{{ label }}</p>
            <p class="mt-1.5 truncate text-[26px] font-extrabold leading-none tracking-tight
                {% if tone == 'gold' %}text-gold-700{% elif tone == 'emerald' %}text-emerald-700{% else %}text-brand-700{% endif %}">{{ value }}</p>
            {% if hint %}<p class="mt-1.5 text-[12px] text-slate-500">{{ hint }}</p>{% endif %}
        </div>
        <span class="flex h-10 w-10 shrink-0 items-center justify-center rounded-xl
            {% if tone == 'gold' %}bg-gold-50 text-gold-700{% elif tone == 'emerald' %}bg-emerald-50 text-emerald-600{% else %}bg-brand-50 text-brand-600{% endif %}">
            <svg class="h-5 w-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">{{ icon|safe }}</svg>
        </span>
    </div>
    {% if spark %}
        <svg class="mt-3 h-8 w-full" viewBox="0 0 100 24" preserveAspectRatio="none" aria-hidden="true">
            <polyline points="{{ spark }}" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round"
                      class="{% if tone == 'gold' %}text-gold-500{% elif tone == 'emerald' %}text-emerald-500{% else %}text-brand-500{% endif %}"/>
        </svg>
    {% endif %}
</article>
