<script>
const MS=[
{n:'Sofía Delgado Cerna',c:'I',k:'Educación Secundaria',e:18,d:'Cajamarca',b:'Llegué al instituto con ganas de aprender y de contagiar mi alegría. Quiero ser la maestra que escucha a cada estudiante.',m:'“Una sonrisa también enseña.”'},
{n:'Valeria Quispe Rojas',c:'II',k:'Educación Primaria',e:18,d:'San Miguel',b:'Desde niña juego a “la profesora” con mis primos. Hoy estudio para hacerlo realidad y llevar la lectura a las zonas rurales.',m:'“Una maestra deja huellas que duran toda la vida.”'},
{n:'Camila Torres Vargas',c:'IV',k:'Educación Inicial',e:19,d:'Bambamarca',b:'Amo el arte y la música. Creo que los primeros años de un niño merecen una escuela alegre, creativa y llena de cariño.',m:'“Cada niño es una semilla de futuro.”'},
{n:'Luciana Salazar Díaz',c:'VI',k:'Educación Física',e:20,d:'Chota',b:'Juego vóley desde los doce años. Quiero que el deporte enseñe a mis alumnos a superarse y a trabajar en equipo.',m:'“Con esfuerzo, todo salto es posible.”'},
{n:'Mariana Cabrera Huamán',c:'VIII',k:'Comunicación',e:21,d:'Cajamarca',b:'Escribo poesía y cuentos. Sueño con formar jóvenes que se expresen con confianza y amen su lengua y su cultura.',m:'“Las palabras también construyen puentes.”'},
{n:'Andrea Chuquiruna León',c:'IX',k:'Ciencias Sociales',e:22,d:'Hualgayoc',b:'Me interesa la historia de mi región y cómo contarla a los jóvenes. Quiero que aprendan a sentirse orgullosos de sus raíces.',m:'“Conocer nuestra historia nos hace libres.”'},
{n:'Daniela Rojas Mego',c:'X',k:'Matemática',e:22,d:'Celendín',b:'Me encantan los retos lógicos. Quiero demostrar que las matemáticas se disfrutan cuando se enseñan con paciencia.',m:'“Aprender es más fácil cuando se aprende juntos.”'}];
const MR=[
{n:'Bruno Silva Paredes',c:'I',k:'Educación Secundaria',e:18,d:'Jaén',b:'Soy curioso y me gusta aprender de todo. Quiero ser un docente cercano, que motive a sus alumnos a no rendirse.',m:'“Nadie aprende solo; aprendemos acompañados.”'},
{n:'Diego Alarcón Vásquez',c:'II',k:'Educación Primaria',e:19,d:'San Miguel',b:'Soy el mayor de tres hermanos y el primero de mi familia en estudiar para ser docente. Quiero enseñar en mi comunidad.',m:'“Enseñar es devolverle a mi tierra lo que me dio.”'},
{n:'Marco Tello Cieza',c:'IV',k:'Educación Inicial',e:20,d:'Bambamarca',b:'Me motivan los niños y el juego como forma de aprender. Sueño con una escuela rural donde cada niño se sienta escuchado.',m:'“Un buen maestro siembra curiosidad.”'},
{n:'Julio Mendoza Rojas',c:'VI',k:'Educación Física',e:21,d:'Chota',b:'Practico atletismo desde la secundaria. Quiero que el deporte sea una herramienta de disciplina y confianza para mis futuros alumnos.',m:'“Cada paso en equipo nos lleva más lejos.”'},
{n:'Franco Díaz Huamán',c:'VIII',k:'Comunicación',e:22,d:'Cajamarca',b:'Me apasiona leer y escribir. Creo que la palabra bien enseñada cambia vidas, y quiero formar lectores críticos.',m:'“Leer abre puertas que nadie puede cerrar.”'},
{n:'Kevin Huamán Cotrina',c:'IX',k:'Ciencia y Tecnología',e:22,d:'Cutervo',b:'Me encantan los experimentos y la tecnología. Quiero que mis alumnos pierdan el miedo a preguntar y a probar.',m:'“La curiosidad es el mejor laboratorio.”'},
{n:'Renzo Chávez Sánchez',c:'X',k:'Matemática',e:23,d:'Celendín',b:'Quiero demostrar que la matemática puede ser clara y cercana. Estoy por terminar mi carrera y listo para ejercer.',m:'“Todo problema tiene solución si lo piensas juntos.”'}];
const C=[...MS.map(x=>({...x,g:'f'})),...MR.map(x=>({...x,g:'m'}))];
const $=s=>document.querySelector(s),app=$('#app'),end=new Date('2026-12-05T18:00:00-05:00');

const fmt=s=>'0:'+String(s).padStart(2,'0'),num=i=>i%7+1,cat=g=>g=='f'?'Miss':'Mister';

{const d=store.get().done;if(d){VC[d.f]++;VC[d.m]++}}

const SK=['#F1C9A5','#E0A97C','#C98E5F','#A86E45','#8A5A3C','#F6D3B3','#D9A273'],HR=['#2B1B12','#4A2C1A','#1B1B1F','#6B3F22','#0F0F12','#3A2418','#5A3A24'],CL=['#0B5D4B','#B45309','#1F3A8A','#7A1F3D','#6D28D9','#0E7490','#9F1239'],B1=['#E3F1EC','#F9E8CF','#E4EAF8','#F6E1E8','#EDE4F7','#DCF0F3','#FBE4E4'],B2=['#BFDCD2','#F0CE9C','#C7D3F0','#EDC3D1','#D6C6EE','#B9E0E7','#F2C6C6'];

return `<svg viewBox="0 0 100 125" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Foto de referencia"><rect width="100" height="125" fill="${bg}"/><g transform="${t}">${f?`<path d="M26 64C21 30 34 13 50 13s29 17 24 51c-1 14 2 30 7 42H19c5-12 8-28 7-42z" fill="${hr}"/>`:''}<path d="M8 125c0-25 17-39 42-39s42 14 42 39z" fill="${cl}"/><rect x="43" y="68" width="14" height="22" rx="6" fill="${sk}"/><ellipse cx="50" cy="52" rx="19" ry="23" fill="${sk}"/>${f?`<path d="M30 52c-3-22 8-33 20-33s23 11 20 33c-5-10-11-15-20-15s-15 5-20 15z" fill="${hr}"/><path d="M38 88q12 15 24 0" fill="${sk}"/>`:`<path d="M31 48c-2-22 8-32 19-32s21 10 19 32c-3-9-9-14-19-14s-16 5-19 14z" fill="${hr}"/><path d="M39 88l11 13 11-13z" fill="#fff"/><path d="M47 98h6l2 22h-10z" fill="#F2A93B"/>`}<circle cx="43" cy="53" r="1.8" fill="#2B1B12"/><circle cx="57" cy="53" r="1.8" fill="#2B1B12"/><path d="M44 62q6 5 12 0" stroke="#7A3B2E" stroke-width="1.6" fill="none" stroke-linecap="round"/>${f&&p==2?'<path d="M36 22l3-9 5 6 6-9 6 9 5-6 3 9z" fill="#F2A93B"/>':''}</g></svg>`};
const ph=(p,i,x)=>`<div class="ph">${av(i,p)}${x||''}</div>`;
const cards=g=>C.map((c,i)=>({c,i})).filter(o=>o.c.g==g).map(({c,i})=>`<a class="cd" href="#candidato-${i}">${ph(1,i,`<span class="l">Ciclo ${c.c}</span><span class="r">0${num(i)}</span>`)}<div class="in"><h3>${c.n}</h3><small>${c.k}</small>${vb(i)}<span class="btn dk">Ver perfil</span></div></a>`).join('');
const sec=(g,alt)=>{const f=g=='f';return `<section class="sc${alt?' alt':''}" id="${f?'miss':'mister'}"><div class="w"><span class="eb">${f?'Candidatas a Miss':'Candidatos a Mister'}</span><h2>${f?'Siete candidatas':'Siete candidatos'}</h2><p style="margin:-12px 0 20px"><span class="bd">Votos en vivo · datos de demostración</span></p><div class="grid">${cards(g)}</div></div></section>`};
function home(){return `<section class="hero"><div class="w hg"><div><span class="pl">Votación abierta · Aniversario 2026</span><h1 style="margin-top:22px">Elige a tu <em>miss</em> y a tu <em>mister</em></h1><p class="lead">Conoce a los participantes de cada categoría, mira su video de presentación y vota por tus favoritos. Tu voto incluye a tu miss y a tu mister.</p><div style="display:flex;flex-wrap:wrap;gap:12px"><a class="btn pri" href="#votar">Votar ahora</a><a class="btn sec" href="#miss">Ver participantes</a></div></div>
<div class="bt"><div class="cdk"><div><span>La votación cierra en</span><span>5 dic · 6:00 p. m.</span></div><div class="un" id="cd"></div></div><div class="bx g"><b>7+7</b><span>candidatas y candidatos</span></div><div class="bx sec" style="justify-content:flex-end"><span>Un solo voto: tu miss y tu mister.</span></div></div></div></section>
${sec('f',1)}${sec('m',0)}
<section class="sc alt" id="como-votar"><div class="w"><span class="eb">Cómo votar</span><h2>Votar toma menos de un minuto</h2><div class="st"><div><b>01</b><h3>Conoce a los participantes</h3><p>Mira sus fotos, su video de presentación de 30 segundos y su perfil.</p></div><div><b>02</b><h3>Elige a tu miss y a tu mister</h3><p>Marca a tu candidata favorita y luego a tu candidato favorito, en dos pasos.</p></div><div><b>03</b><h3>Confirma tu voto</h3><p>Revisas tus dos elecciones y confirmas. Es un solo voto y recibes un comprobante. Luego sigues el conteo en vivo.</p></div></div></div></section>
<section class="sc" id="bases"><div class="w bs"><div><span class="eb">Bases del concurso</span><h2 style="margin-bottom:20px">Reglas claras, elección justa</h2><a class="btn sec" href="#bases" style="border:1px solid var(--ln)">Descargar bases (PDF)</a></div><div><details open><summary>Periodo de votación</summary><p>Del [fecha de inicio] al 5 de diciembre de 2026, 6:00 p. m., hora de Lima.</p></details><details><summary>Quiénes pueden votar</summary><p>[Público en general / solo comunidad del instituto]. Un solo voto por persona, que incluye a tu Miss y a tu Mister.</p></details><details><summary>Voto definitivo</summary><p>Una vez confirmado, el voto no puede modificarse ni anularse.</p></details><details><summary>Resultados en vivo</summary><p>El conteo de votos de cada participante se actualiza durante toda la votación y es visible para todos.</p></details><details><summary>Videos y fotos</summary><p>Cada participante presenta dos fotos y un video de hasta 30 segundos.</p></details></div></div></section>`}
const gal=i=>`${ph(P,i,`<span class="l">Ciclo ${C[i].c}</span><span class="r">${P} / 2</span><button class="ar" data-g="t" style="left:16px" aria-label="Foto anterior">←</button><button class="ar" data-g="t" style="right:16px" aria-label="Foto siguiente">→</button>`)}<div class="th">${[1,2].map(n=>`<button type="button" data-g="${n}" aria-pressed="${n==P}" aria-label="Ver foto ${n}">${n}</button>`).join('')}</div>`;
const vid=()=>`<div class="vd" id="vd"><span class="tt">Video de presentación · 0:30</span><button class="pl2" type="button" data-v="1" aria-label="Reproducir o pausar el video"><span>▶</span></button><div class="bar"><span id="vt">0:00</span><div class="pg"><i id="vg"></i></div><span>0:30</span></div></div>`;
function pv(){const d=$('#vd');if(!d)return;if(VT){clearInterval(VT);VT=null;d.classList.remove('on');return}d.classList.add('on');VT=setInterval(()=>{T++;if(T>=30){clearInterval(VT);VT=null;T=0;d.classList.remove('on')}$('#vt').textContent=fmt(T);$('#vg').style.width=T/30*100+'%'},1000)}
function det(i){const c=C[i],f=c.g=='f';P=1;return `<div class="w" style="padding-top:28px;padding-bottom:72px"><a class="btn sec" href="#${f?'miss':'mister'}" style="min-height:44px">← ${f?'Candidatas':'Candidatos'}</a><div class="dt"><div class="gal" id="gal">${gal(i)}</div><div><div class="tg"><span>${f?'Candidata':'Candidato'} N.º 0${num(i)}</span><span>Ciclo ${c.c}</span><span>${cat(c.g)}</span></div><h1>${c.n}</h1>${vb(i)}<div class="sx"><div><small>Edad</small><b>${c.e} años</b></div><div><small>Carrera</small><b>${c.k}</b></div><div><small>Procedencia</small><b>${c.d}</b></div></div><span class="eb">Sobre ${f?'ella':'él'}</span><p>${c.b}</p><span class="eb">Video de presentación</span>${vid()}<blockquote>${c.m}</blockquote><button type="button" class="btn pri" data-pick="${i}" style="width:100%;min-height:58px;font-size:17px">Elegir a ${c.n.split(' ')[0]}</button><p class="sm" style="margin-top:10px">Eliges a tu ${f?'miss':'mister'} y luego a tu ${f?'mister':'miss'}; ambos van en un solo voto.</p><a class="btn sec" style="margin-top:16px;min-height:44px" href="https://wa.me/?text=${encodeURIComponent('Vota por '+c.n+' en el Aniversario del IESP')}">Compartir por WhatsApp</a></div></div></div>`}
const grid=g=>{const f=g=='f';return C.map((c,i)=>({c,i})).filter(o=>o.c.g==g).map(({c,i})=>{const on=SEL[g]==i;return `<div class="cd${on?' sel':''}">${ph(1,i,`<span class="l">Ciclo ${c.c}</span><span class="r">0${num(i)}</span>`)}<div class="in"><h3>${c.n}</h3><small>${c.k}</small><button type="button" class="btn ${on?'pri':'dk'}" data-sel="${i}" aria-pressed="${on}">${on?(f?'Elegida ✓':'Elegido ✓'):(f?'Elegir candidata':'Elegir candidato')}</button><a class="vp" href="#candidato-${i}">Ver perfil y video</a></div></div>`}).join('')};
const stp=n=>`<div class="stp">${['1 · Miss','2 · Mister','3 · Confirmar'].map((t,j)=>`<span class="${j+1==n?'on':''}">${t}</span>`).join('')}</div>`;
function pick(g){const f=g=='f';return `<div class="w" style="padding-top:36px;padding-bottom:72px">${stp(f?1:2)}<h1 class="t" style="font-size:clamp(34px,5vw,56px);margin:20px 0 8px">${f?'Elige a tu miss':'Elige a tu mister'}</h1><p class="lead" style="margin:0 0 28px">${f?'Marca a la candidata que más te gustó. Después elegirás a tu mister.':'Ahora marca al candidato que más te gustó.'}</p><div class="grid" id="pk">${grid(g)}</div><div class="act">${f?'':'<a class="btn sec" href="#votar">← Volver a Miss</a>'}<button type="button" class="btn pri" id="nx" data-to="${f?'votar-mister':'votar-confirmar'}" ${SEL[g]==null?'disabled':''}>${f?'Siguiente: elegir Mister →':'Revisar mi voto →'}</button></div></div>`}
const row=(i,l,to)=>{const c=C[i];return `<div class="who" style="width:100%;text-align:left"><i></i><span><small>${l}</small><b>${c.n}</b><small style="color:var(--ac);font-weight:700">N.º 0${num(i)} · Ciclo ${c.c}</small></span><a class="btn sec" href="#${to}" style="min-height:40px;margin-left:auto;font-size:13px;padding:0 16px">Cambiar</a></div>`};
const conf=()=>`<div class="vc ctr" id="vc" style="max-width:560px">${stp(3)}<h1>Confirma tu voto</h1>${row(SEL.f,'Tu miss','votar')}${row(SEL.m,'Tu mister','votar-mister')}<button type="button" class="btn pri" id="cf" style="width:100%;min-height:58px;font-size:16px">Confirmar mi voto</button><p class="sm">Es un solo voto con tu miss y tu mister. No podrás cambiarlo después.</p><p class="demo">Demostración: el voto no se guarda en ningún servidor.</p></div>`;
const fin=d=>`<div class="vc ctr" id="vc"><span class="bd">Voto registrado</span><h1 style="font-size:36px">¡Gracias por votar!</h1><p style="margin:0;line-height:1.6;color:var(--mut)">Tu voto quedó registrado: <strong style="color:var(--ink)">${C[d.f].n}</strong> como Miss y <strong style="color:var(--ink)">${C[d.m].n}</strong> como Mister.</p><div class="rc"><span>Comprobante<b>${d.code}</b></span><span>Voto<b>Miss + Mister</b></span></div><p class="sm">Ahora ${C[d.f].n.split(' ')[0]} lleva ${VC[d.f]} votos y ${C[d.m].n.split(' ')[0]}, ${VC[d.m]}. Sigue el conteo en vivo en la página de inicio.</p><a class="btn pri" href="#inicio" style="width:100%">Volver al inicio</a><button type="button" class="btn sec" id="rs" style="width:100%;min-height:44px;font-size:13px">Reiniciar demostración</button></div>`;
function tick(){const el=$('#cd');if(!el)return;let m=Math.max(0,end-Date.now());const u=[864e5,36e5,6e4,1e3].map(k=>{const v=Math.floor(m/k);m-=v*k;return String(v).padStart(2,'0')});el.innerHTML=['días','horas','min','seg'].map((l,j)=>`<div><b>${u[j]}</b><span>${l}</span></div>`).join('')}
function route(){clearInterval(VT);VT=null;T=0;let h=location.hash.slice(1)||'inicio';const m=h.match(/^candidato-(\d+)$/);
if(h=='votar-mister'&&SEL.f==null)h='votar';if(h=='votar-confirmar'&&SEL.f==null)h='votar';if(h=='votar-confirmar'&&SEL.m==null)h='votar-mister';
if(m&&C[m[1]]){app.innerHTML=det(+m[1]);scrollTo(0,0)}
else if(/^votar/.test(h)){const d=store.get().done;app.innerHTML=d?fin(d):h=='votar'?pick('f'):h=='votar-mister'?pick('m'):conf();scrollTo(0,0)}
else{if(!$('.hero'))app.innerHTML=home();tick();const t=document.getElementById(h);t&&h!='inicio'?t.scrollIntoView():scrollTo(0,0)}}
addEventListener('hashchange',route);setInterval(tick,1000);
app.addEventListener('click',e=>{const v=e.target.closest('[data-v]'),g=e.target.closest('[data-g]'),s=e.target.closest('[data-sel]'),k=e.target.closest('[data-pick]'),n=e.target.closest('#nx'),f=e.target.closest('#cf'),r=e.target.closest('#rs');
if(v)pv();
if(g){const i=+location.hash.split('-')[1];P=g.dataset.g=='t'?(P==1?2:1):+g.dataset.g;$('#gal').innerHTML=gal(i)}
if(s){const i=+s.dataset.sel,q=C[i].g;SEL[q]=i;$('#pk').innerHTML=grid(q);$('#nx').disabled=false}
if(k){const i=+k.dataset.pick,q=C[i].g;SEL[q]=i;location.hash=q=='f'?'votar-mister':SEL.f!=null?'votar-confirmar':'votar'}
if(n)location.hash=n.dataset.to;
if(f){const x=()=>Math.random().toString(36).slice(2,6).toUpperCase(),d={f:SEL.f,m:SEL.m,code:'AN-'+x()+'-'+x()};store.set({done:d});VC[d.f]++;VC[d.m]++;app.innerHTML=fin(d);scrollTo(0,0)}
if(r){store.set({});VC.splice(0,14,...BASE);SEL={f:null,m:null};location.hash='inicio'}});
setInterval(()=>{VC[Math.floor(Math.random()*14)]++;refresh()},5000);
route();
</script></body></html>
